<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarLink 设备</title><link rel="stylesheet" href="/style.css"><main><h1>CarLink</h1><p id="status">正在读取连接状态…</p><div id="devices"></div><h2>添加设备</h2><button id="apple">添加 iPhone</button><button id="huawei">添加华为 HiCar</button><p>添加设备会停止当前无线投屏，配对窗口持续两分钟。已有手机请从上方点“连接”，配对失效时会自动修复。</p><h2>连接方式</h2><button id="last">优先上次使用</button><button id="manual">每次手动选择</button><button id="pause">暂停自动连接</button><button id="resume">恢复自动连接</button><button id="disconnect">断开当前手机</button><h2>车机菜单</h2><button id="menu">打开设备菜单</button><button id="return">返回投屏</button><h2>声音调节</h2><label for="volume">音量：<output id="volume-value">100</output>%</label><input id="volume" type="range" min="0" max="100" step="5" value="100"><p>调节 CarLink 投屏输出声音，设置会自动保存。</p><p id="message" role="status"></p></main><script src="/app.js"></script></html>
