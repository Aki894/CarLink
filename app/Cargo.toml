[package]
name = "carlink"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Linux hardware diagnostics and CarLife mobile-device development for CarLink"
license = "MIT"

[dependencies]
libloading = "=0.8.9"
serde = "=1.0.228"
serde_json = "=1.0.145"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
