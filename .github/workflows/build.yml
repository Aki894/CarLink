name: CarLink builds
on:
  push:
    paths: ['app/**', 'receiver/**', 'firmware/**', 'scripts/**', 'sources.lock.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
    inputs:
      firmware:
        description: Build complete dual-protocol firmware from the verified kernel baseline
        type: boolean
        default: true
      kernel_baseline:
        description: Rebuild the kernel/base image only (not a complete CarLink release)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: carlink-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and locked toolchain
        run: |
          find firmware -name '*.sh' -o -name '*.conf' | while read -r file; do
            case "$file" in */overlay/*) continue;; esac
            bash -n "$file"
          done
          python3 -m py_compile scripts/*.py
          python3 scripts/test-boot-profile.py
          python3 scripts/test-production-runtime.py
          python3 scripts/test-release-source.py
          python3 -m unittest discover -s receiver -p 'test_*.py'
          bash -n scripts/verify-image.sh
          bash -n scripts/build-carplay.sh
          bash -n scripts/run-carplay.sh
          bash -n receiver/carplay-output.sh
          bash -n scripts/run-carlink.sh
          bash -n scripts/build-audio.sh
          bash scripts/test-uboot-config.sh
          bash scripts/test-image-validation.sh
          echo "RUST_VERSION=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["application"]["rust"])')" >> "$GITHUB_ENV"
          echo "TARGET=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["application"]["target"])')" >> "$GITHUB_ENV"
      - name: Use official Ubuntu archive for build dependencies
        run: |
          # Azure's mirror can deliver 147 MB of dependencies in tens of minutes.
          # Keep Ubuntu package signatures/verification and use its canonical archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - name: Install ARM hard-float compiler and pinned Rust
        run: |
          sudo apt-get update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user ffmpeg dbus-daemon libdbus-1-3
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Reuse pinned Rust dependencies and cross build objects
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
            app/target
            .build/carplay/target
          key: carlink-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/Cargo.lock', 'sources.lock.json', 'receiver/patches/*.patch') }}
          restore-keys: |
            carlink-rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Test and cross compile app
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo +"$RUST_VERSION" test --locked --manifest-path app/Cargo.toml
          cargo +"$RUST_VERSION" run --quiet --locked --manifest-path app/Cargo.toml -- doctor --json > /tmp/carlink-doctor.json
          python3 scripts/test-hicar-rust.py app/target/debug/carlink
          python3 scripts/test-hicar-rust-session.py app/target/debug/carlink
          python3 scripts/test-hicar-identity-init.py app/target/debug/carlink
          python3 scripts/test-hicar-rust-hisight.py app/target/debug/carlink
          timeout 120s python3 scripts/test-hicar-rust-dmsdp.py app/target/debug/carlink
          timeout 120s python3 scripts/test-hicar-rust-live.py app/target/debug/carlink
          timeout 120s python3 scripts/test-hicar-rust-backend.py app/target/debug/carlink
          python3 scripts/test-manager.py app/target/debug/carlink
          python3 scripts/test-carplay-output.py app/target/debug/carlink
          python3 scripts/test-manager-web.py app/target/debug/carlink
          python3 -c 'import json; d=json.load(open("/tmp/carlink-doctor.json")); assert d["schema_version"] == 1; assert d["aoa"]["status"] == "not_tested"'
          cargo +"$RUST_VERSION" build --release --locked --manifest-path app/Cargo.toml --target "$TARGET"
          mkdir -p dist/app
          cp "app/target/$TARGET/release/carlink" dist/app/
          arm-linux-gnueabihf-readelf -h dist/app/carlink | tee dist/app/elf-header.txt
          grep -q 'Machine:.*ARM' dist/app/elf-header.txt
          (cd dist/app && sha256sum carlink > SHA256SUMS)
          cp sources.lock.json dist/app/
          python3 scripts/package-app-notices.py dist/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned ARMv7 CarPlay receiver and output process
        run: |
          bash scripts/build-carplay.sh
          PYTHONPATH=dist/carplay/hicar/python timeout 120s python3 scripts/test-hicar-rust-radio.py app/target/debug/carlink
          python3 scripts/test-live-bridge.py app/target/debug/carlink dist/carplay/bin/carlink-audio
          CARLINK_FORWARD_IMPLEMENTATION=rust python3 scripts/test-live-bridge.py app/target/debug/carlink dist/carplay/bin/carlink-audio
          printf '#!/bin/sh\nexec qemu-arm -L /usr/arm-linux-gnueabihf "%s/dist/carplay/bin/carlink-audio" "$@"\n' "$PWD" > .build/carplay-output-test-audio
          chmod +x .build/carplay-output-test-audio
          CARLINK_AUDIO_TEST_BINARY="$PWD/.build/carplay-output-test-audio" cargo +"$RUST_VERSION" test --locked --manifest-path app/Cargo.toml carplay_output:: -- --nocapture
          CARLINK_AUDIO_TEST_BINARY="$PWD/.build/carplay-output-test-audio" cargo +"$RUST_VERSION" test --locked --manifest-path app/Cargo.toml hicar::uplink:: -- --nocapture
          python3 scripts/test-runtime-install.py dist/app dist/carplay
      - uses: actions/upload-artifact@v4
        with:
          name: carplay-armv7
          path: dist/carplay/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: carlink-armv7
          path: dist/app/
          retention-days: 14
  firmware:
    if: github.event_name == 'workflow_dispatch' && inputs.firmware && !inputs.kernel_baseline
    needs: app
    uses: ./.github/workflows/hicar-auth.yml
    with:
      app_run_id: ${{ github.run_id }}
    secrets: inherit
  baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.firmware && inputs.kernel_baseline
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Read Armbian lock
        run: echo "ARMBIAN_SHA=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["armbian"]["commit"])')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_SHA }}
          path: .build/armbian
      - uses: actions/download-artifact@v4
        with:
          name: carlink-armv7
          path: dist/app/
      - uses: actions/download-artifact@v4
        with:
          name: carplay-armv7
          path: dist/carplay/
      - name: Reclaim unused hosted runner SDK space
        run: |
          # Only fixed paths on a disposable GitHub-hosted Linux runner; keep swap.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h
          free -h
          available=$(df --output=avail -BG "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          test "$available" -ge 50 || { echo 'Need at least 50 GiB free for Armbian'; exit 1; }
      - name: Stage project overlay and verify upstream kernel config
        run: python3 scripts/prepare-build.py .build/armbian dist/app/carlink dist/carplay
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Compile kernel, drivers and minimal image
        working-directory: .build/armbian
        run: ./compile.sh carlink-h3 SHOW_LOG=yes SHARE_LOG=no
      - name: Collect image and checksums
        run: |
          mkdir -p dist/firmware
          find .build/armbian/output/images -type f -name '*.img.xz' -exec cp '{}' dist/firmware/ \;
          test "$(find dist/firmware -name '*.img.xz' | wc -l)" -eq 1
          cp .build/armbian/userpatches/overlay/carlink-build.json dist/firmware/
          cp .build/armbian/output/info/carlink-uboot.config dist/firmware/
          xz -t dist/firmware/*.img.xz
          compressed=$(find dist/firmware -name '*.img.xz' -print -quit)
          xz -dk "$compressed"
          bash scripts/verify-image.sh "${compressed%.xz}" --baseline | tee dist/firmware/image-validation.txt
          rm "${compressed%.xz}"
          cd dist/firmware
          sha256sum -- *.img.xz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: carlink-h3-baseline-image
          path: dist/firmware/
          compression-level: 0
          retention-days: 14
      - name: Preserve Armbian logs and packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlink-h3-build-evidence
          path: |
            .build/armbian/output/logs/
            .build/armbian/output/debs/
            .build/armbian/output/info/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
