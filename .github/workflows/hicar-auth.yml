name: Experimental Linux HiCar authentication
on:
  workflow_dispatch:
    inputs:
      app_run_id:
        description: Successful app run used for the matching firmware refresh
        type: string
        default: '39818918089'
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install native and ARMv7 build dependencies
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build \
            build-essential gcc-arm-linux-gnueabihf libc6-dev-armhf-cross python3 python3-venv qemu-user \
            libssl-dev libmbedtls-dev libcjson-dev \
            libssl-dev:armhf libmbedtls-dev:armhf libcjson-dev:armhf
      - name: Test transport, private identity and fixed PIN
        run: |
          python3 -m venv .build/hicar-test-python
          .build/hicar-test-python/bin/pip install --require-hashes -r experiments/hicar/requirements.txt
          .build/hicar-test-python/bin/python -m unittest discover -s experiments/hicar -p 'test_*.py'
          .build/hicar-test-python/bin/python -m unittest discover -s receiver -p 'test_*.py'
      - name: Package public experimental receiver sources
        run: |
          mkdir -p dist/hicar-source/experiments/hicar dist/hicar-source/receiver
          cp experiments/hicar/*.py experiments/hicar/requirements.txt dist/hicar-source/experiments/hicar/
          cp receiver/forward.py receiver/probe.py receiver/test_forward.py dist/hicar-source/receiver/
          printf '%s\n' "$GITHUB_SHA" > dist/hicar-source/COMMIT
          (cd dist/hicar-source && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hicar-source-experimental
          path: dist/hicar-source/
          if-no-files-found: error
          retention-days: 14
      - name: Fetch pinned public sources and build native host library
        run: |
          python3 experiments/hicar/native/fetch.py "$PWD/.build/hicar-native-deps"
          cmake -S experiments/hicar/native -B .build/hicar-native-host -G Ninja \
            -DSOURCE_ROOT="$PWD/.build/hicar-native-deps" -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/hicar-native-host --parallel 4
          python3 experiments/hicar/native/test_library.py .build/hicar-native-host/libcarlink_hichain.so
          python3 experiments/hicar/native/test_pake.py .build/hicar-native-host/libcarlink_hichain.so
      - uses: actions/upload-artifact@v4
        with:
          name: hicar-auth-host-test
          path: .build/hicar-native-host/libcarlink_hichain.so
          if-no-files-found: error
          retention-days: 14
      - name: Cross compile and package ARMv7 authentication library
        run: |
          cmake -S experiments/hicar/native -B .build/hicar-native-armhf -G Ninja \
            -DSOURCE_ROOT="$PWD/.build/hicar-native-deps" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/experiments/hicar/native/armhf.cmake"
          cmake --build .build/hicar-native-armhf --parallel 4
          mkdir -p dist/hicar-auth/lib dist/hicar-auth/licenses
          cp .build/hicar-native-armhf/libcarlink_hichain.so dist/hicar-auth/
          cp -L /usr/lib/arm-linux-gnueabihf/libmbedcrypto.so.7 dist/hicar-auth/lib/
          cp -L /usr/lib/arm-linux-gnueabihf/libcjson.so.1 dist/hicar-auth/lib/
          cp -L /usr/lib/arm-linux-gnueabihf/libcrypto.so.3 dist/hicar-auth/lib/
          cp experiments/hicar/native/sources.json dist/hicar-auth/
          for name in deviceauth huks securec; do
            cp ".build/hicar-native-deps/$name/LICENSE" "dist/hicar-auth/licenses/$name.txt"
          done
          cp /usr/share/doc/libmbedcrypto7/copyright dist/hicar-auth/licenses/mbedtls.txt
          cp /usr/share/doc/libcjson1/copyright dist/hicar-auth/licenses/cjson.txt
          cp /usr/share/doc/libssl3/copyright dist/hicar-auth/licenses/openssl.txt
          arm-linux-gnueabihf-readelf -h dist/hicar-auth/libcarlink_hichain.so > dist/hicar-auth/elf-header.txt
          grep -q 'Machine:.*ARM' dist/hicar-auth/elf-header.txt
          (cd dist/hicar-auth && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hicar-auth-armv7-experimental
          path: dist/hicar-auth/
          if-no-files-found: error
          retention-days: 14
  rust-interop:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install matching ARM runtime and host native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user gcc-arm-linux-gnueabihf libmbedcrypto7 libcjson1
      - uses: actions/download-artifact@v4
        with:
          name: hicar-auth-armv7-experimental
          path: dist/hicar-auth
      - uses: actions/download-artifact@v4
        with:
          name: hicar-auth-host-test
          path: .build/hicar-native-host
      - uses: actions/download-artifact@v4
        with:
          name: carlink-armv7
          path: .build/hicar-rust-arm
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify ARMv7 Rust protocol and mixed native authentication
        run: |
          (cd .build/hicar-rust-arm && sha256sum -c SHA256SUMS)
          chmod +x .build/hicar-rust-arm/carlink
          export CARLINK_RUST_RUNNER="$(python3 -c 'import json,os; print(json.dumps(["qemu-arm","-L","/usr/arm-linux-gnueabihf","-E","LD_LIBRARY_PATH="+os.getcwd()+"/dist/hicar-auth/lib:/usr/arm-linux-gnueabihf/lib"]))')"
          python3 scripts/test-hicar-rust.py .build/hicar-rust-arm/carlink
          python3 scripts/test-hicar-rust-auth.py .build/hicar-rust-arm/carlink \
            .build/hicar-native-host/libcarlink_hichain.so dist/hicar-auth/libcarlink_hichain.so
          python3 scripts/test-hicar-rust-session.py .build/hicar-rust-arm/carlink \
            .build/hicar-native-host/libcarlink_hichain.so dist/hicar-auth/libcarlink_hichain.so
  firmware:
    needs: [native, rust-interop]
    uses: ./.github/workflows/refresh-image.yml
    with:
      base_run_id: '39459953269'
      app_run_id: ${{ inputs.app_run_id }}
      driver_run_id: '39670639717'
      variant: main
      disable_onboard_wifi: true
    secrets: inherit
