# H3/ARMv7, not Orange Pi Zero 2/3.
BOARD=orangepizero
BRANCH=current
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
KERNEL_KEEP_CONFIG=no
KERNEL_BTF=no
# First baseline must actually compile artifacts rather than download OCI builds.
ARTIFACT_IGNORE_CACHE=yes
EXPERT=yes
NETWORKING_STACK=network-manager
HOST=carlink-h3
COMPRESS_OUTPUTIMAGE=sha,xz
ENABLE_EXTENSIONS=carlink
